<body>

    <!-- TABLE CONTENTS SIDEBAR -->

    <nav>

        <h3>Naviagation</h3>

            <li><a href="https://substack.com/@johnathanlbingham">My SubStack</a></li>

        </ul>

        <a href="Bleak-Forest-Core.html">  <img class="sidebar-stamp" src="images/stamp1.png" alt="Signature Stamp"></a>

        </div>

    </nav>
<div class="sidebar-overlay"></div>

    <!-- MAIN BOOK PAGE -->
    <main>
        <section id="introduction">
         <div class="top-title">
            <div class="crest">
            <img src="images/BFSigil3.png" alt="Sigil" class="title-sigil">
            <h1>Bleak Forest</h1>

</div>
<img src="images/BFComingSoon3.png" alt="Bleak Forest Core Rules Engine Coming Soon" class="coming-soon">
        

    </main>
<script>
const hamburger = document.querySelector('.hamburger');
const sidebar = document.querySelector('nav');
const overlay = document.querySelector('.sidebar-overlay');
const closeBtn = document.querySelector('.close-sidebar');

function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('active');
}

function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
}

hamburger.addEventListener('click', openSidebar);
closeBtn.addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);
</script>


</body>
